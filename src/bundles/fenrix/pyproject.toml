[project]
name = "lfx-fenrix"
version = "0.2.0"
description = "Fenrix - FenrixCloud platform glue: a pre-configured Ollama model provider plus components for the rest of the platform (e.g. LibreChat memories)."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [
    { name = "Fenrix", email = "engineering@fenrix.io" },
]
keywords = ["langflow", "lfx", "extension", "bundle", "ollama", "fenrix", "model-provider"]

# Runtime deps: lfx supplies the provider-registry seam this bundle plugs its
# ``providers[]`` block into. Fenrix reuses the ``ChatOllama`` class lfx's core
# Ollama provider already resolves lazily (langchain_ollama), so the bundle
# does not import or depend on it directly. ``httpx`` backs the SSRF-safe live
# ``/api/tags`` discovery and credential-validation probe.
dependencies = [
    "lfx>=1.12.0.dev0,<2.0.0",
    "httpx>=0.24.0,<1.0.0",
]

[project.urls]
Homepage = "https://fenrix.io"
Repository = "https://fenrix.io"

# Manifest-shipping distributions are discovered via the ``langflow.extensions``
# entry-point; editable installs whose ``dist.files`` only surfaces dist-info
# entries fall back to this entry-point to find the manifest.
[project.entry-points."langflow.extensions"]
lfx-fenrix = "lfx_fenrix"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# extension.json + the discovery module live inside the lfx_fenrix package so
# ``importlib.metadata.files(dist)`` finds the manifest and the registry can
# import the live-discovery / validator callables by dotted path.
packages = ["src/lfx_fenrix"]
include = [
    "src/lfx_fenrix/extension.json",
    "src/lfx_fenrix/*.py",
    "src/lfx_fenrix/components/**/*.py",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/lfx_fenrix",
    "extension.json",
    "README.md",
    "pyproject.toml",
]
